robot:
  name: "cobot"
  base_frame: "base_link"
  tool_frame: "tool0"
  planning_group: "manipulator"
  joint_names:
    - "joint_1"
    - "joint_2"
    - "joint_3"
    - "joint_4"
    - "joint_5"
    - "joint_6"

ros:
  joint_states_topic: "/joint_states"
  trajectory_action: "/manipulator_controller/joint_trajectory"
  move_group_action: "/move_action"
  tf_topic: "/tf"
  tf_static_topic: "/tf_static"

gazebo:
  launch_package: "arm_bringup"
  launch_file: "gazebo.launch.py"

moveit:
  launch_package: "arm_bringup"
  launch_file: "moveit_gazebo.launch.py"
